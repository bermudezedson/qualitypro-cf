# QualityPro v2 — Cloudflare (Workers + D1 + R2)
name = "qualitypro-v2"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "7a7a6f232ae4f5a5b3963b25b0894388"
routes = [
  { pattern = "qualitypro.cl", custom_domain = true },
  { pattern = "qualitypro-v2.asiquedo.cl", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "qualitypro-v2"
database_id = "e04e09a2-cd53-4d0e-8cb6-f0817994d1a0"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "qualitypro-v2-media"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Dominio canónico del sitio. Al pasar a producción: SITE_URL = "https://qualitypro.cl" y
# HOSTS_ALIAS = "www.qualitypro.cl,qualitypro-v2.asiquedo.cl" (esos hosts redirigen 301 al canónico).
SITE_URL = "https://qualitypro.cl"
HOSTS_ALIAS = "www.qualitypro.cl,qualitypro-v2.asiquedo.cl"
# Clave pública del widget de Cloudflare Turnstile (anti-bots de los formularios). El secreto va en
# `wrangler secret put TURNSTILE_SECRET`. Sin estas claves, los formularios usan honeypot + límite por IP.
TURNSTILE_SITE_KEY = "0x4AAAAAAGGTIuaOqOCa3U4m"
